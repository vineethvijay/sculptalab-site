<section id="top" class="page-section page-section--hero">
  <p class="eyebrow">{{heroEyebrow}}</p>
  <h1>{{heroH1}}</h1>
  <p>{{heroBody}}</p>
  <p class="actions">
    <a class="btn-primary" href="{{pilotHref}}">{{heroPrimaryCta}}</a>
    <a class="btn-secondary" href="{{homeHref}}#train">{{heroSecondaryCta}}</a>
  </p>
  <p class="microcopy">{{heroMicrocopy}}</p>
  <p class="microcopy">{{heroTranslationNote}}</p>
</section>

<section id="route-body" class="page-section">
  <h2>{{routeH1}}</h2>
  <p>{{routeIntro}}</p>
  {{routeExtra}}
</section>

<section id="store-status" class="page-section page-section--muted">
  <p class="store-status" data-play="{{configPlay}}">{{storePlay}}</p>
  <p class="store-status" data-ios="{{configIos}}">{{storeIos}}</p>
  <p class="contact-pending">{{demoContact}}</p>
</section>
